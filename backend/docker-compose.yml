services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: tourverse_db
      POSTGRES_USER: tourverse_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - tourverse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourverse_user -d tourverse_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TOURVERSE_PORT:-8080}:8080"
    environment:
      TOURVERSE_ENV: production
      TOURVERSE_DATABASE_URL: jdbc:postgresql://postgres:5432/tourverse_db
      TOURVERSE_DATABASE_USER: tourverse_user
      TOURVERSE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TOURVERSE_JWT_SECRET: ${TOURVERSE_JWT_SECRET:?Set TOURVERSE_JWT_SECRET}
      TOURVERSE_ALLOWED_ORIGINS: ${TOURVERSE_ALLOWED_ORIGINS:?Set TOURVERSE_ALLOWED_ORIGINS}
      TOURVERSE_RATE_LIMIT_PER_MINUTE: ${TOURVERSE_RATE_LIMIT_PER_MINUTE:-120}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  tourverse_postgres_data:
